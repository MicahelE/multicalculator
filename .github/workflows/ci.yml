name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/multicalculator.itechy.xyz

            # Refuse to deploy onto a PHP vulnerable to PHP2Shell (CVE-2026-109618/109619, fixed 2026-10-21)
            php -r '$min = ["8.2" => "8.2.35", "8.3" => "8.3.36", "8.4" => "8.4.27", "8.5" => "8.5.12"][PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION] ?? "99"; if (version_compare(PHP_VERSION, $min, "<")) { fwrite(STDERR, "PHP ".PHP_VERSION." is vulnerable (PHP2Shell). Upgrade to $min+ first.\n"); exit(1); }'

            # Unlock immutable critical files for deploy
            sudo chattr -i public/index.php public/.htaccess 2>/dev/null || true

            git pull origin main

            # Restore correct ownership/permissions after git pull
            sudo chown -R mikeserver:www-data public/
            sudo find public/ -type d -exec chmod 755 {} \;
            sudo find public/ -type f -exec chmod 644 {} \;

            composer install --no-dev --optimize-autoloader
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            npm ci && npm run build
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Re-lock critical files after deploy (file-integrity protection)
            sudo chattr +i public/index.php public/.htaccess
